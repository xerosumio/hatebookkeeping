# Runs the API only. MongoDB and Authentik are separate services reached
# through .env, and the web app is a static build (see docs/DEPLOY.md).
#
#   cp .env.example .env      # then fill it in; see docs/SETUP.md
#   docker compose up --build

services:
  hbk:
    build:
      context: .
      dockerfile: Dockerfile
    image: hatebookkeeping:latest
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
